<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>
  html, body { margin: 0; width: 1280px; height: 720px; background: #000; overflow: hidden; }
  #yt, iframe, video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; pointer-events: none; }
  /* Écran de fin : même écran que le countdown (tête de démon), sans les chiffres */
  #end { display: none; z-index: 10; }
  #end.on { display: block; }
</style>
</head>
<body>
<div id="yt"></div>
<iframe id="end" src="screen.html"></iframe>
<script>
  // La page charge la vidéo EN PAUSE (première image prête) puis attend { action: 'play', t: <secondes> }
  const q = new URLSearchParams(location.search);
  const yt = q.get('yt');
  const src = q.get('src');
  const endFrame = document.getElementById('end');

  let ready = false;
  let pending = null;
  let player = null;
  let vid = null;

  // Fin de la vidéo -> on affiche l'écran démon (sans countdown)
  function showEnd() {
    endFrame.classList.add('on');
    if (vid) vid.pause();
    if (player) { try { player.stopVideo(); } catch (e) {} }
  }

  function play(t) {
    if (!ready) { pending = t; return; }
    if (player) {
      player.seekTo(t, true);
      player.playVideo();
    } else if (vid) {
      const go = () => {
        // Joueur qui arrive après la fin de la vidéo : on ne la relance pas
        if (vid.duration && t >= vid.duration - 0.2) { showEnd(); return; }
        if (t > 0) vid.currentTime = t;
        vid.play().catch(() => {});
      };
      if (vid.readyState >= 1) go();
      else vid.addEventListener('loadedmetadata', go, { once: true });
    }
  }

  window.addEventListener('message', (e) => {
    const d = e.data;
    if (d && d.action === 'play') play(parseInt(d.t, 10) || 0);
  });

  if (yt) {
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
    window.onYouTubeIframeAPIReady = () => {
      player = new YT.Player('yt', {
        width: '100%',
        height: '100%',
        videoId: yt,
        host: 'https://www.youtube-nocookie.com',
        playerVars: {
          autoplay: 0, controls: 0, disablekb: 1, fs: 0, rel: 0,
          modestbranding: 1, playsinline: 1, iv_load_policy: 3,
        },
        events: {
          onReady: (ev) => {
            ev.target.mute();
            ready = true;
            if (pending !== null) play(pending);
          },
          onStateChange: (ev) => {
            if (ev.data === YT.PlayerState.ENDED) showEnd();
          },
        },
      });
    };
  } else if (src) {
    document.getElementById('yt').remove();
    vid = document.createElement('video');
    vid.src = src;
    vid.muted = true;
    vid.playsInline = true;
    vid.preload = 'auto';
    // Affiche la 1re image en pause (évite l'écran noir au démarrage)
    vid.addEventListener('loadeddata', () => {
      if (vid.paused && !vid.currentTime) vid.currentTime = 0.001;
    }, { once: true });
    vid.addEventListener('ended', showEnd);
    const markReady = () => {
      if (ready) return;
      ready = true;
      if (pending !== null) play(pending);
    };
    vid.addEventListener('canplaythrough', markReady);
    // Secours : si le navigateur ne signale jamais "canplaythrough", on démarre quand même
    vid.addEventListener('canplay', () => setTimeout(markReady, 3000));
    document.body.appendChild(vid);
    vid.load();
  }
</script>
</body>
</html>
